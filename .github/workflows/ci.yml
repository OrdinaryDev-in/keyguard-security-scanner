name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the --history self-scan

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race ./...

      - name: Build
        run: go build -o bin/keyguard ./cmd/keyguard

      # Dogfooding: keyguard must find nothing in its own code or history.
      - name: Self-scan
        run: ./bin/keyguard scan . --history --fail-on low
